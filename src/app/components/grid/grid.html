<div class="board">
  @for (row of puzzle.cells; track $index; let r = $index) {
    <div class="row">
      @for (cell of row; track $index; let c = $index) {
        <app-cell
          [cell]="cell()"
          [class.box-right]="c === 2 || c === 5"
          [class.box-bottom]="r === 2 || r === 5"
        />
      }
    </div>
  }
</div>
